<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt hàng E-Commerce</title>

    ```
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        
        tfoot {
            font-weight: bold;
            background: #f5f5f5;
        }
        
        fieldset {
            margin-bottom: 20px;
            padding: 15px;
        }
        
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        
        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        button {
            padding: 10px 20px;
            margin-top: 15px;
        }
    </style>
    ```

</head>

<body>

    <h1>Đặt hàng sản phẩm</h1>

    <form action="#" method="POST">

        ```
        <!-- PHẦN 1: GIỎ HÀNG -->

        <fieldset>

            <legend>Giỏ hàng</legend>

            <table>

                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>1</td>
                        <td>iPhone 16 Pro Max</td>
                        <td>25.990.000đ</td>
                        <td>1</td>
                        <td>25.990.000đ</td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>AirPods Pro 2</td>
                        <td>5.990.000đ</td>
                        <td>1</td>
                        <td>5.990.000đ</td>
                    </tr>

                    <tr>
                        <td>3</td>
                        <td>Apple Watch Series 10</td>
                        <td>9.990.000đ</td>
                        <td>1</td>
                        <td>9.990.000đ</td>
                    </tr>

                </tbody>

                <tfoot>
                    <tr>
                        <td colspan="4">Tổng cộng</td>
                        <td>41.970.000đ</td>
                    </tr>
                </tfoot>

            </table>

        </fieldset>

        <!-- PHẦN 2: THANH TOÁN -->

        <fieldset>

            <legend>Thông tin thanh toán</legend>

            <label>Phương thức thanh toán</label>

            <div class="radio-group">

                <div>
                    <input type="radio" id="cod" name="payment" value="COD" required>

                    <label for="cod">COD</label>
                </div>

                <div>
                    <input type="radio" id="bank" name="payment" value="Chuyển khoản">

                    <label for="bank">Chuyển khoản</label>
                </div>

                <div>
                    <input type="radio" id="wallet" name="payment" value="Ví điện tử">

                    <label for="wallet">Ví điện tử</label>
                </div>

            </div>

            <label for="coupon">Mã giảm giá</label>

            <input type="text" id="coupon" name="coupon" placeholder="Ví dụ: SALE2026" pattern="SALE[0-9]{4}">

            <label for="note">Ghi chú</label>

            <textarea id="note" name="note" rows="4" placeholder="Nhập ghi chú nếu có"></textarea>

        </fieldset>

        <!-- PHẦN 3: GIAO HÀNG -->

        <fieldset>

            <legend>Thông tin giao hàng</legend>

            <label for="deliveryDate">
                Ngày giao hàng mong muốn
            </label>

            <input type="date" id="deliveryDate" name="deliveryDate" min="2026-06-07">

            <label for="timeSlot">
                Khung giờ giao hàng
            </label>

            <select id="timeSlot" name="timeSlot">

                <option value="">
                    -- Chọn khung giờ --
                </option>

                <option>
                    Sáng 8-12h
                </option>

                <option>
                    Chiều 14-18h
                </option>

                <option>
                    Tối 18-21h
                </option>

            </select>

            <label for="shippingDays">
                Thời gian giao hàng (ngày)
            </label>

            <input type="range" id="shippingDays" name="shippingDays" min="1" max="7" step="1">

        </fieldset>

        <button type="submit" aria-label="Xác nhận đặt hàng">

            Đặt hàng

        </button> ```

    </form>

</body>

</html>
