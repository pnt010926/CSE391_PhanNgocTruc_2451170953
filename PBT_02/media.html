<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu sản phẩm Multimedia</title>
</head>

<body>

    ```
    <h1>Giới thiệu iPhone 16 Series</h1>

    <!-- SVG Logo -->
    <h2>Logo sản phẩm</h2>

    <svg width="120" height="120">

        <circle cx="60" cy="60" r="50" fill="royalblue">
        </circle>

        <text x="35" y="68" fill="white" font-size="20">

            IP16

        </text>

    </svg>

    <hr>

    <!-- Ảnh sản phẩm -->
    <h2>Hình ảnh sản phẩm</h2>

    <figure>

        <img src="images/iphone16-front.jpg" alt="iPhone 16 Pro Max màu Titan đen mặt trước" loading="lazy" style="max-width:100%; height:auto;">

        <figcaption>
            iPhone 16 Pro Max Titan đen - Mặt trước
        </figcaption>

    </figure>

    <figure>

        <img src="images/iphone16-back.jpg" alt="iPhone 16 Pro Max màu Titan đen mặt sau" loading="lazy" style="max-width:100%; height:auto;">

        <figcaption>
            iPhone 16 Pro Max Titan đen - Mặt sau
        </figcaption>

    </figure>

    <figure>

        <img src="images/iphone16-camera.jpg" alt="Cụm camera iPhone 16 Pro Max độ phân giải cao" loading="lazy" style="max-width:100%; height:auto;">

        <figcaption>
            Camera 48MP thế hệ mới
        </figcaption>

    </figure>

    <hr>

    <!-- Video YouTube -->
    <h2>Video giới thiệu từ YouTube</h2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/TX9qSaGXFyg" title="YouTube video player" allowfullscreen>
    </iframe>

    <hr>

    <!-- Video HTML5 -->
    <h2>Video sản phẩm HTML5</h2>

    <video controls width="700" poster="images/poster.jpg">

        <source src="videos/iphone16.mp4" type="video/mp4">

        <source src="videos/iphone16.webm" type="video/webm">

        Trình duyệt của bạn không hỗ trợ video.

    </video>

    <hr>

    <!-- Audio -->
    <h2>Nhạc nền giới thiệu sản phẩm</h2>

    <audio controls>

        <source src="audio/background.mp3" type="audio/mpeg">

        Trình duyệt của bạn không hỗ trợ audio.

    </audio> ```

</body>

</html>
