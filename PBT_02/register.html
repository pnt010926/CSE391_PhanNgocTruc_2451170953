<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản E-Commerce</title>

    ```
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        
        fieldset {
            margin-bottom: 20px;
            padding: 15px;
        }
        
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .radio-group label {
            display: inline;
        }
        
        .checkbox-group {
            margin-top: 15px;
        }
        
        button {
            padding: 10px 20px;
            margin-right: 10px;
        }
    </style>
    ```

</head>

<body>

    <h1>Đăng ký tài khoản E-Commerce</h1>

    <form action="#" method="POST">

        ```
        <!-- Fieldset 1 -->
        <fieldset>

            <legend>Thông tin cá nhân</legend>

            <label for="fullname">Họ tên</label>
            <input type="text" id="fullname" name="fullname" placeholder="Nhập họ tên" required minlength="2" maxlength="50">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Nhập email" required>

            <label for="phone">Số điện thoại</label>
            <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại 10 chữ số" pattern="[0-9]{10}">

            <label for="birthday">Ngày sinh</label>
            <input type="date" id="birthday" name="birthday" max="2026-06-06">

        </fieldset>

        <!-- Fieldset 2 -->
        <fieldset>

            <legend>Tài khoản</legend>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="3-20 ký tự, chữ, số hoặc dấu _" pattern="^[A-Za-z0-9_]{3,20}$" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Ít nhất 8 ký tự, 1 chữ hoa và 1 số" minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" required>

            <label for="confirmPassword">Xác nhận Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" required>

        </fieldset>

        <!-- Fieldset 3 -->
        <fieldset>

            <legend>Thông tin giao hàng</legend>

            <label for="city">Thành phố</label>
            <select id="city" name="city">

                <option value="">-- Chọn thành phố --</option>
                <option>Hà Nội</option>
                <option>TP Hồ Chí Minh</option>
                <option>Đà Nẵng</option>
                <option>Hải Phòng</option>
                <option>Cần Thơ</option>

            </select>

            <label for="district">Quận/Huyện</label>
            <select id="district" name="district">

                <option>Quận 1</option>
                <option>Quận 3</option>
                <option>Quận 7</option>
                <option>Thanh Xuân</option>
                <option>Cầu Giấy</option>

            </select>

            <label for="address">Địa chỉ chi tiết</label>
            <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ chi tiết"></textarea>

            <label>Giới tính</label>

            <div class="radio-group">

                <div>
                    <input type="radio" id="male" name="gender" value="Nam">

                    <label for="male">Nam</label>
                </div>

                <div>
                    <input type="radio" id="female" name="gender" value="Nữ">

                    <label for="female">Nữ</label>
                </div>

                <div>
                    <input type="radio" id="other" name="gender" value="Khác">

                    <label for="other">Khác</label>
                </div>

            </div>

        </fieldset>

        <div class="checkbox-group">

            <input type="checkbox" id="agree" name="agree" required>

            <label for="agree">
                Tôi đồng ý với điều khoản sử dụng
            </label>

        </div>

        <br>

        <button type="submit">
            Đăng ký
        </button>

        <button type="reset">
            Làm lại
        </button> ```

    </form>

</body>

</html>
