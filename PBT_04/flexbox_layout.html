<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Shop</title>

    <link rel="stylesheet" href="./flexbox_layout.css">
</head>

<body>


    <nav class="navbar">

        <!-- LOGO -->
        <div class="logo">
            MyShop
        </div>

        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
        </ul>

        <div class="auth-buttons">
            <button class="login-btn">Login</button>
            <button class="register-btn">Register</button>
        </div>

    </nav>


    <section class="products-container">

        <div class="product-card">
            <img src="https://picsum.photos/300/200?1" alt="Product">

            <div class="product-info">
                <h3>Gaming Mouse</h3>
                <p class="price">$25</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://picsum.photos/300/200?2" alt="Product">

            <div class="product-info">
                <h3>Mechanical Keyboard</h3>
                <p class="price">$80</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://picsum.photos/300/200?3" alt="Product">

            <div class="product-info">
                <h3>Headphone</h3>
                <p class="price">$50</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://picsum.photos/300/200?4" alt="Product">

            <div class="product-info">
                <h3>Monitor</h3>
                <p class="price">$220</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://picsum.photos/300/200?5" alt="Product">

            <div class="product-info">
                <h3>Gaming Chair</h3>
                <p class="price">$150</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://picsum.photos/300/200?6" alt="Product">

            <div class="product-info">
                <h3>Speaker</h3>
                <p class="price">$70</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://picsum.photos/300/200?7" alt="Product">

            <div class="product-info">
                <h3>Webcam</h3>
                <p class="price">$40</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://picsum.photos/300/200?8" alt="Product">

            <div class="product-info">
                <h3>Microphone</h3>
                <p class="price">$95</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

    </section>

</body>

</html>
