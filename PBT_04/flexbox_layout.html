<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout">

        <header class="header">
            <h1>MyShop</h1>

            <nav>
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <section class="hero">
            <h2>Gaming Collection 2026</h2>
            <p>Best products for gamers</p>
        </section>

        <aside class="sidebar">

            <h3>Filters</h3>

            <label>
                <input type="checkbox">
                Gaming
            </label>

            <label>
                <input type="checkbox">
                Keyboard
            </label>

            <label>
                <input type="checkbox">
                Mouse
            </label>

            <label>
                <input type="checkbox">
                Headphone
            </label>

            <label>
                <input type="checkbox">
                Laptop
            </label>

        </aside>

        <main class="main-content">

            <div class="products-grid">

                <div class="card">
                    <img src="https://picsum.photos/300/200?1" alt="">
                    <h3>Gaming Mouse</h3>
                    <p>$25</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="https://picsum.photos/300/200?2" alt="">
                    <h3>Mechanical Keyboard</h3>
                    <p>$80</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="https://picsum.photos/300/200?3" alt="">
                    <h3>Gaming Headset</h3>
                    <p>$60</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="https://picsum.photos/300/200?4" alt="">
                    <h3>Gaming Chair</h3>
                    <p>$150</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="https://picsum.photos/300/200?5" alt="">
                    <h3>Monitor</h3>
                    <p>$220</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="https://picsum.photos/300/200?6" alt="">
                    <h3>Microphone</h3>
                    <p>$95</p>
                    <button>Buy Now</button>
                </div>

            </div>

        </main>

        <aside class="ads">

            <h3>Advertisement</h3>

            <img src="https://picsum.photos/180/400" alt="Ads">

        </aside>

        <footer class="footer">
            <p>© 2026 MyShop. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
