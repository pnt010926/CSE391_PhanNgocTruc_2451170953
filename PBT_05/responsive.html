<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Shop</title>

    <link rel="stylesheet" href="responsive.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            MyShop
        </div>

        <div class="hamburger">
            ☰
        </div>

        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <div class="layout">

        <aside class="sidebar">

            <h3>Filters</h3>

            <label><input type="checkbox"> Gaming</label>
            <label><input type="checkbox"> Laptop</label>
            <label><input type="checkbox"> Mouse</label>
            <label><input type="checkbox"> Keyboard</label>

        </aside>

        <main class="products">

            <div class="product-grid">

                <div class="card">
                    <img src="images/product1.jpg" alt="">
                    <h3>Gaming Mouse</h3>
                    <p>$25</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="images/product2.jpg" alt="">
                    <h3>Keyboard</h3>
                    <p>$80</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="images/product3.jpg" alt="">
                    <h3>Headphone</h3>
                    <p>$60</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="images/product4.jpg" alt="">
                    <h3>Gaming Chair</h3>
                    <p>$150</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="images/product5.jpg" alt="">
                    <h3>Monitor</h3>
                    <p>$220</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="images/product6.jpg" alt="">
                    <h3>Microphone</h3>
                    <p>$95</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="images/product7.jpg" alt="">
                    <h3>Speaker</h3>
                    <p>$70</p>
                    <button>Buy Now</button>
                </div>

                <div class="card">
                    <img src="images/product8.jpg" alt="">
                    <h3>Webcam</h3>
                    <p>$45</p>
                    <button>Buy Now</button>
                </div>

            </div>

        </main>

        <aside class="ads">

            <h3>Advertisement</h3>

            <img src="images/ads.jpg" alt="">

        </aside>

    </div>

    <footer class="footer">
        © 2026 MyShop
    </footer>

</body>

</html>
